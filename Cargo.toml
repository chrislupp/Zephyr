[package]
name = "pegasus-vlm"
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
description = "Vortex Lattice Method aerodynamics library"
license = "GPL-3.0-or-later"
repository = "https://github.com/chrislupp/Pegasus"
readme = "README.md"
keywords = ["aerodynamics", "vlm", "aircraft", "optimization"]
categories = ["science", "simulation"]
include = [
    "/src/**",
    "/tests/**",
    "/examples/*.rs",
    "/benches/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/rust-toolchain.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[features]
default = ["vtk"]
vtk = ["dep:vtkio"]

[dependencies]
faer = "0.24.4"
nalgebra = "0.35.0"
num-complex = "0.4.6"
thiserror = "2.0"
vtkio = { version = "0.6.3", optional = true }

[dev-dependencies]
approx = "0.5"
criterion = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[[bench]]
name = "analysis_scaling"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
