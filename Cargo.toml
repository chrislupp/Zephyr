[package]
name = "pegasus-vlm"
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
description = "Vortex Lattice Method aerodynamics library"
license = "GPL-3.0-or-later"
repository = "https://github.com/chrislupp/Pegasus"
readme = "README.md"
keywords = ["aerodynamics", "vlm", "aircraft", "optimization"]
categories = ["science", "simulation"]
include = [
    "/src/**",
    "/tests/**",
    "/examples/*.rs",
    "/benches/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/rust-toolchain.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[features]
default = ["vtk"]
vtk = ["dep:vtkio"]

[dependencies]
faer = { version = "0.24.4", default-features = false, features = ["std", "linalg"] }
nalgebra = "0.35.0"
num-complex = "0.4.6"
thiserror = "2.0"
vtkio = { version = "0.6.3", optional = true }

[dev-dependencies]
approx = "0.5"
criterion = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[[bench]]
name = "analysis_scaling"
harness = false

# Cargo ignores a library's profile settings when the crate is consumed as a
# dependency, so this governs only this workspace's examples, benches, and
# tests. It matters because the influence kernel is defined in a different
# module from the assembly loop that calls it N^2 times: without fat LTO and a
# single codegen unit it is not reliably inlined, and the loop loses the
# instruction-level parallelism that hides its divide/sqrt latency.
[profile.release]
lto = "fat"
codegen-units = 1
debug = 1          # line tables only; symbolizes profiles, no runtime cost

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
