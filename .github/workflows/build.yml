name: Build and Tests

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
      - run: cargo test --all-features

  linux-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
      - run: cargo test --release --all-features
      - run: cargo test --no-default-features
      - run: cargo package
      - name: Smoke-test native examples
        run: |
          cargo run --example basic_analysis
          cargo run --example trim_flight
          cargo run --example stability_analysis
          output_dir="$(mktemp -d)"
          cargo run --example vtk_visualization -- "$output_dir"
          test -f "$output_dir/surface_mesh.vtu"
          test -f "$output_dir/spanwise_loads.vtp"
          test -f "$output_dir/wake.vtp"
          test -f "$output_dir/velocity_field.vtp"

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Enforce 92% line coverage
        run: cargo llvm-cov --all-features --workspace --fail-under-lines 92 --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
