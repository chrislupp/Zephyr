name: Build and Tests

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # `format` and `build` are the two contexts `develop`'s branch protection
  # requires. The names are inherited from the C++ workflow and are kept
  # verbatim so the required checks keep reporting; `build` runs the test
  # suite despite the name.
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
      - run: cargo test --all-features

  parallel-feature:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
          components: clippy
      - run: cargo clippy --all-targets --features parallel -- -D warnings
      - run: cargo test --features parallel
      # Influence assembly must produce identical results however the source
      # columns are distributed across threads.
      - name: Verify thread-count invariance
        run: |
          for threads in 1 2 4; do
            RAYON_NUM_THREADS="$threads" cargo test --release --features parallel
          done

  linux-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
      - run: cargo test --release --all-features
      - run: cargo test --no-default-features
      - run: cargo package
      - name: Smoke-test native examples
        run: |
          cargo run --example basic_analysis
          cargo run --example trim_flight
          cargo run --example stability_analysis
          output_dir="$(mktemp -d)"
          cargo run --example vtk_visualization -- "$output_dir"
          test -f "$output_dir/surface_mesh.vtu"
          test -f "$output_dir/spanwise_loads.vtp"
          test -f "$output_dir/wake.vtp"
          test -f "$output_dir/velocity_field.vtp"

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Enforce 92% line coverage
        run: cargo llvm-cov --all-features --workspace --fail-under-lines 92 --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
