name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  release:
    if: >
      github.event.pull_request.merged == true &&
      (contains(github.event.pull_request.labels.*.name, 'release') ||
       contains(github.event.pull_request.labels.*.name, 'prerelease'))
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Configure signed release commits
        run: |
          cat > /tmp/gpg-key-params <<GPGEOF
          %no-protection
          Key-Type: RSA
          Key-Length: 4096
          Subkey-Type: RSA
          Subkey-Length: 4096
          Name-Real: github-actions[bot]
          Name-Email: 41898282+github-actions[bot]@users.noreply.github.com
          Expire-Date: 1d
          GPGEOF
          gpg --batch --gen-key /tmp/gpg-key-params
          KEY_ID=$(gpg --list-secret-keys --keyid-format=long | awk '/sec/{print $2; exit}' | cut -d/ -f2)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.signingkey "$KEY_ID"
          git config commit.gpgsign true
          git config tag.gpgsign true

      - name: Validate release labels
        id: labels
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          IS_RELEASE=false
          IS_PRERELEASE=false
          BUMP=""
          BUMP_COUNT=0
          QUALIFIER=""
          QUALIFIER_COUNT=0

          for label in $LABELS; do
            case "$label" in
              release) IS_RELEASE=true ;;
              prerelease) IS_PRERELEASE=true ;;
              major|minor|patch)
                BUMP="$label"
                BUMP_COUNT=$((BUMP_COUNT + 1))
                ;;
              alpha|beta|rc)
                QUALIFIER="$label"
                QUALIFIER_COUNT=$((QUALIFIER_COUNT + 1))
                ;;
            esac
          done

          if $IS_RELEASE && $IS_PRERELEASE; then
            echo "::error::Use exactly one of the release or prerelease labels."
            exit 1
          fi
          if [ "$BUMP_COUNT" -ne 1 ]; then
            echo "::error::Use exactly one of the major, minor, or patch labels."
            exit 1
          fi
          if $IS_PRERELEASE && [ "$QUALIFIER_COUNT" -ne 1 ]; then
            echo "::error::Prereleases require exactly one alpha, beta, or rc label."
            exit 1
          fi
          if $IS_RELEASE && [ "$QUALIFIER_COUNT" -ne 0 ]; then
            echo "::error::Stable releases cannot have alpha, beta, or rc labels."
            exit 1
          fi

          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "qualifier=$QUALIFIER" >> "$GITHUB_OUTPUT"

      - name: Calculate release version
        id: version
        run: |
          CURRENT=$(git tag --list 'v*' --sort=-v:refname |
            sed -nE '/^v[0-9]+\.[0-9]+\.[0-9]+$/ { s/^v//; p; q; }')
          if [ -z "$CURRENT" ]; then
            CURRENT=$(python3 -c \
              'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"].split("-", 1)[0])')
          fi
          if [ -z "$CURRENT" ]; then
            echo "::error::Could not determine the latest stable version."
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<EOF
          $CURRENT
          EOF

          case "${{ steps.labels.outputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          BASE_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          PACKAGE_VERSION="$BASE_VERSION"

          if [ "${{ steps.labels.outputs.is_prerelease }}" = "true" ]; then
            QUALIFIER="${{ steps.labels.outputs.qualifier }}"
            LATEST_TAG=$(git tag -l "v${BASE_VERSION}-${QUALIFIER}.*" | sort -V | tail -n1)
            PRERELEASE_NUMBER=1
            if [ -n "$LATEST_TAG" ]; then
              PREVIOUS_NUMBER="${LATEST_TAG##*.}"
              PRERELEASE_NUMBER=$((PREVIOUS_NUMBER + 1))
            fi
            PACKAGE_VERSION="${BASE_VERSION}-${QUALIFIER}.${PRERELEASE_NUMBER}"
          fi

          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_version=v${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: $PACKAGE_VERSION"

      - name: Write release version
        run: |
          python3 scripts/update_copyright.py \
            --version "${{ steps.version.outputs.package_version }}" .
          cargo check
          grep -m1 '^version = ' Cargo.toml
          grep -A1 '^name = "pegasus-vlm"$' Cargo.lock

      - name: Finalize changelog
        run: |
          TAG="${{ steps.version.outputs.tag_version }}"
          VERSION="${{ steps.version.outputs.package_version }}"
          DATE=$(date +%Y-%m-%d)
          REPOSITORY="https://github.com/chrislupp/Pegasus"

          sed -i "s/^## \[Unreleased\]/## [Unreleased]\n\n## [${VERSION}] - ${DATE}/" CHANGELOG.md
          sed -i '/^\[Unreleased\]:/d' CHANGELOG.md
          printf '\\n[Unreleased]: %s/compare/%s...HEAD\\n[%s]: %s/releases/tag/%s\\n' \
            "$REPOSITORY" "$TAG" "$VERSION" "$REPOSITORY" "$TAG" >> CHANGELOG.md

      - name: Test and package release
        run: |
          cargo test --release --all-features
          cargo test --no-default-features
          cargo package --allow-dirty --locked

      - name: Set up Node.js
        if: steps.labels.outputs.is_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Snapshot stable documentation
        if: steps.labels.outputs.is_release == 'true'
        working-directory: docs
        run: |
          npm ci
          npx docusaurus docs:version "${{ steps.version.outputs.base_version }}"
          npm run build

      - name: Commit release metadata
        run: |
          VERSION="${{ steps.version.outputs.package_version }}"
          git add -A
          git commit -S -m "chore: release version ${VERSION}"

      - name: Create and push release tag
        run: |
          TAG="${{ steps.version.outputs.tag_version }}"
          git tag -s "$TAG" -m "Release ${TAG}"
          git push origin main
          git push origin "$TAG"

      - name: Extract release notes
        run: |
          VERSION="${{ steps.version.outputs.package_version }}"
          awk -v version="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" version "]")) found=1
              next
            }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_version }}
          name: ${{ steps.version.outputs.tag_version }}
          body_path: /tmp/release-notes.md
          files: target/package/pegasus-vlm-*.crate
          prerelease: ${{ steps.labels.outputs.is_prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Merge release metadata back to develop
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          git fetch origin develop
          git checkout develop
          if git merge main --no-edit; then
            git push origin develop
          else
            git merge --abort
            gh pr create \
              --base develop \
              --head main \
              --title "chore: merge release ${{ steps.version.outputs.tag_version }} back to develop" \
              --body "The automatic release merge conflicted. Please resolve it manually."
          fi
