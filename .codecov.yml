codecov:
  require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 1%

ignore:
  - "tests/**/*"
  - "examples/**/*"
  - "**/test_*.cpp"
  - "**/*_test.cpp"
  - "build/**/*"
  - "cmake-build-*/**/*"
  - "scripts/**/*"
  - "docs/**/*"
  - "src/philote/**/*"
  - "include/pegasus/philote/**/*"
  - "src/visualization/**/*"
  - "include/pegasus/visualization/**/*"

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
